<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wall Heat Loss</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  /* Layout: one narrow column — inputs card, wall cross-section, results list */
  :root {
    --bg: #f3f5f7;
    --surface: #ffffff;
    --fg: #1c242c;
    --muted: #5d6a76;
    --line: #d5dce3;
    --cold: #2f6fb3;
    --warm: #c8551f;
    --font-display: "Barlow Semi Condensed", "Arial Narrow", sans-serif;
    --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-data: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12171c; --surface: #1b2229; --fg: #e4e9ee; --muted: #93a0ac;
      --line: #2e3842; --cold: #6aa6e8; --warm: #f0864f; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12171c; --surface: #1b2229; --fg: #e4e9ee; --muted: #93a0ac;
    --line: #2e3842; --cold: #6aa6e8; --warm: #f0864f; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.5 var(--font-body);
    padding-inline: 16px; padding-block: 32px 48px;
  }
  main { max-width: 560px; margin: 0 auto; display: grid; gap: 24px; }
  h1 {
    font: 700 2.25rem/1.1 var(--font-display); margin: 0; text-wrap: balance;
    letter-spacing: -0.01em;
  }
  .lede { margin: 6px 0 0; color: var(--muted); }
  .lede b { font-weight: 600; }
  .lede .c { color: var(--cold); } .lede .w { color: var(--warm); }

  form {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 20px; display: grid; gap: 16px; grid-template-columns: 1fr 1fr;
  }
  .field { display: grid; gap: 6px; min-width: 0; }
  .field.full { grid-column: 1 / -1; }
  label {
    font: 500 0.8rem var(--font-display); text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--muted);
  }
  .input-wrap { position: relative; }
  input, select {
    width: 100%; font: 400 1.05rem var(--font-data); color: var(--fg);
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
    padding: 10px 12px;
  }
  input { padding-right: 64px; }
  .unit {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    font: 0.85rem var(--font-data); color: var(--muted); pointer-events: none;
  }
  input:focus-visible, select:focus-visible { outline: 2px solid var(--warm); outline-offset: 1px; }
  input[aria-invalid="true"] { border-color: var(--warm); }
  .error { grid-column: 1 / -1; margin: 0; color: var(--warm); font-size: 0.9rem; }

  figure { margin: 0; }
  svg { display: block; width: 100%; height: auto; }
  svg .frame { fill: var(--surface); stroke: var(--line); }
  svg .s-warm { stop-color: var(--warm); } svg .s-cold { stop-color: var(--cold); }
  svg .lbl { font: 500 14px var(--font-display); letter-spacing: 1px; }
  svg .temp { font: 600 24px var(--font-data); }
  svg .warm { fill: var(--warm); } svg .cold { fill: var(--cold); }
  svg .arrow { stroke: var(--fg); stroke-width: 2; fill: none; }
  svg .head { fill: var(--fg); }
  svg .flow { fill: var(--fg); font: 600 14px var(--font-data); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; }
  figcaption { font-size: 0.85rem; color: var(--muted); margin-top: 6px; }

  .results { display: grid; gap: 0; margin: 0; }
  .row {
    display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
    padding-block: 10px; border-bottom: 1px solid var(--line);
  }
  .row dt { color: var(--muted); }
  .row dd { margin: 0; font: 600 1.05rem var(--font-data); font-variant-numeric: tabular-nums; }
  .row.main dd { font-size: 1.6rem; color: var(--warm); }
  .formula { font: 0.85rem var(--font-data); color: var(--muted); margin: 0; }

  @media (max-width: 440px) {
    form { grid-template-columns: 1fr; }
    h1 { font-size: 1.9rem; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Wall Heat Loss</h1>
    <p class="lede">Heat flowing out through a wall with <b class="w">20 °C</b> inside and <b class="c">−13 °C</b> outside.</p>
  </header>

  <form id="calc" novalidate>
    <div class="field">
      <label for="width">Width</label>
      <div class="input-wrap"><input id="width" type="number" inputmode="decimal" min="0" step="0.1" value="5"><span class="unit">m</span></div>
    </div>
    <div class="field">
      <label for="height">Height</label>
      <div class="input-wrap"><input id="height" type="number" inputmode="decimal" min="0" step="0.1" value="2.5"><span class="unit">m</span></div>
    </div>
    <div class="field">
      <label for="wall">Wall type</label>
      <select id="wall">
        <option value="0.15">Passive house (0.15)</option>
        <option value="0.28" selected>Insulated wall (0.28)</option>
        <option value="0.6">Older, thin insulation (0.6)</option>
        <option value="1.5">Uninsulated brick (1.5)</option>
        <option value="custom">Custom…</option>
      </select>
    </div>
    <div class="field">
      <label for="u">U-value</label>
      <div class="input-wrap"><input id="u" type="number" inputmode="decimal" min="0" step="0.01" value="0.28"><span class="unit">W/m²K</span></div>
    </div>
    <p class="error" id="error" role="alert" hidden></p>
  </form>

  <figure aria-hidden="true">
    <svg viewBox="0 0 520 150">
      <defs>
        <linearGradient id="grad" x1="0" x2="1">
          <stop offset="0" class="s-warm"></stop>
          <stop offset="1" class="s-cold"></stop>
        </linearGradient>
      </defs>
      <rect x="0.5" y="0.5" width="519" height="149" rx="10" class="frame"></rect>
      <text x="24" y="40" class="lbl warm">INSIDE</text>
      <text x="24" y="72" class="temp warm">20 °C</text>
      <text x="496" y="40" text-anchor="end" class="lbl cold">OUTSIDE</text>
      <text x="496" y="72" text-anchor="end" class="temp cold">−13 °C</text>
      <rect x="230" y="14" width="60" height="122" fill="url(#grad)" opacity="0.85"></rect>
      <path d="M150 110 H350" class="arrow"></path>
      <path d="M360 110 l-12 -7 v14 z" class="head"></path>
      <text x="260" y="98" text-anchor="middle" class="flow" id="svgQ"></text>
    </svg>
    <figcaption>Heat moves from the warm side through the wall to the cold side.</figcaption>
  </figure>

  <section aria-live="polite">
    <dl class="results">
      <div class="row main"><dt>Heat loss</dt><dd id="q">—</dd></div>
      <div class="row"><dt>Wall area</dt><dd id="area">—</dd></div>
      <div class="row"><dt>Temperature difference</dt><dd id="dt">33.0 K</dd></div>
      <div class="row"><dt>Energy per day</dt><dd id="day">—</dd></div>
    </dl>
    <p class="formula">Q = U × A × (T<sub>in</sub> − T<sub>out</sub>)</p>
  </section>
</main>

<script>
  const T_INSIDE = 20;
  const T_OUTSIDE = -13;

  function heatLoss(width, height, u) {
    return u * width * height * (T_INSIDE - T_OUTSIDE);
  }

  const $ = id => document.getElementById(id);
  const fields = { width: $("width"), height: $("height"), u: $("u") };
  const names = { width: "Width", height: "Height", u: "U-value" };

  function read(input) {
    const v = parseFloat(String(input.value).replace(",", "."));
    return Number.isFinite(v) && v > 0 ? v : null;
  }

  function update() {
    const vals = {};
    const bad = [];
    for (const [key, input] of Object.entries(fields)) {
      vals[key] = read(input);
      input.setAttribute("aria-invalid", vals[key] === null ? "true" : "false");
      if (vals[key] === null) bad.push(names[key]);
    }
    const err = $("error");
    if (bad.length) {
      err.textContent = `${bad.join(", ")}: enter a number greater than 0.`;
      err.hidden = false;
      ["q", "area", "day"].forEach(id => $(id).textContent = "—");
      $("svgQ").textContent = "";
      return;
    }
    err.hidden = true;
    const q = heatLoss(vals.width, vals.height, vals.u);
    $("q").textContent = `${q.toFixed(1)} W`;
    $("area").textContent = `${(vals.width * vals.height).toFixed(2)} m²`;
    $("day").textContent = `${(q * 24 / 1000).toFixed(2)} kWh`;
    $("svgQ").textContent = `${Math.round(q)} W`;
  }

  $("wall").addEventListener("change", e => {
    if (e.target.value !== "custom") fields.u.value = e.target.value;
    else fields.u.focus();
    update();
  });
  fields.u.addEventListener("input", () => {
    const match = [...$("wall").options].find(o => o.value === fields.u.value);
    $("wall").value = match ? match.value : "custom";
  });
  Object.values(fields).forEach(f => f.addEventListener("input", update));
  $("calc").addEventListener("submit", e => e.preventDefault());
  update();
</script>
</body>
</html>
